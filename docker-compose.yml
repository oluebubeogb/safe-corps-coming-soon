services:
  web:
    build: .
    # Coolify injects its own reverse proxy / networking.
    # Do NOT publish host ports here — that causes "port is already allocated".
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
