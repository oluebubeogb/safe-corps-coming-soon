services:
  web:
    build: .
    ports:
      - "80:80"
    restart: unless-stopped
    # Coolify will inject its own networking; this works for local & Coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
